[project]
name = "gra"
version = "0.1.0"
description = "A small CLI for creating new pages in my Obsidian vault"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "pyyaml>=6.0.2",
    "rich>=13.7.0",
    "typer>=0.25.1",
]

[project.scripts]
gra = "gra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gra"]
